services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springcopilotonl-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/lincopilot_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
